# Dependency-free production deployment: five pre-rendered HTML pages, no npm registry needed.
[build]
  command = "npm run build"
  publish = "dist"
[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/digital-marketing"
  to = "/digital-marketing/"
  status = 301
[[redirects]]
  from = "/ai-web-development"
  to = "/ai-web-development/"
  status = 301
[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301
[[redirects]]
  from = "/contact"
  to = "/contact/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
